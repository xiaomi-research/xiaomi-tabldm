name: Translate README

on:
  push:
    branches:
      - main
    paths:
      - README.md

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # 保留已有译文，供增量翻译使用
      - name: Prepare existing Chinese README
        run: |
          if [ -f README_CN.md ]; then
            cp README_CN.md README.zh-CN.md
          fi

      - name: Translate README
        uses: ikhsan3adi/markdown-translator@v3
        with:
          LANG: zh-CN
          FILES: README.md
          COMMIT: false
          PUSH: false

      - name: Rename and commit
        run: |
          mv -f README.zh-CN.md README_CN.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README_CN.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: update Chinese README"
            git push
          fi
